# Local stack: single-node Kafka (KRaft, no ZooKeeper) + the pipeline.
#
#   docker compose up -d kafka stream                          # broker + continuous streaming job
#   docker compose run --rm pipeline python -m telecom_stream.simulator --phase 1
#   docker compose run --rm pipeline python -m telecom_stream.batch all
#
# Kafka is reachable from the host on localhost:9092 and from containers on kafka:29092.

x-pipeline: &pipeline
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment:
    TELECOM_SOURCE_MODE: kafka
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    TELECOM_DATA_ROOT: /data
  volumes:
    - pipeline-data:/data
    - ivy-cache:/root/.ivy2  # spark-sql-kafka jars, downloaded once
  depends_on:
    kafka:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20

  stream:
    <<: *pipeline
    command: ["python", "-m", "telecom_stream.streaming_job", "--trigger", "continuous"]
    restart: on-failure

  pipeline:
    <<: *pipeline
    profiles: ["tools"]
    command: ["python", "-m", "telecom_stream.batch", "all"]

volumes:
  pipeline-data:
  ivy-cache:
