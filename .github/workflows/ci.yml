name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit + streaming tests
        run: pytest -q
      - name: End-to-end scenario (file mode)
        run: python scripts/run_e2e.py

  kafka-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-spark-sql-kafka-3.5.3
      - run: pip install -e ".[dev]"
      - name: End-to-end scenario against a real Kafka broker
        env:
          TELECOM_SOURCE_MODE: kafka
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: python scripts/run_e2e.py

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: docker compose config --quiet
      - name: Build the pipeline image
        run: docker build -f docker/Dockerfile -t telecom-pipeline .
      - name: Unit tests inside the image
        run: docker run --rm telecom-pipeline python -m pytest -q
